name: ImgTools
version: 1.0.0-beta
authors:
- adpchrgruber
description: "Image passes for compositing your renders: Clown ID (flat object-ID colours), Z Depth (live depth view and exact PNG/16-bit PNG/EXR depth maps), Shadows (the raw cast shadows of the sun or lights, hard or soft) and Ambient Occlusion. Replaces ClownID and ZDepth. Works on Mac and Windows."
